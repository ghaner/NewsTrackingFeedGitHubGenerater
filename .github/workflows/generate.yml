name: Update Event Feed

# 每小时定时增量抓取各事件的后续报道，
# 合并进时间轴后重新生成 duanju.xml，由 GitHub Pages 对外提供订阅地址。
#
# 三层韧性（与 feed-github-generater 方法论一致）：
#   1) 抓取失败 → fetch_articles.py 自己吞掉异常并输出空文件，不中断流程；
#   2) 无新增 → rebuild.py 打印 NO_NEW 且不改动 event.json，feed 保持上一版；
#   3) 生成 0 条 → generate_feed.py 跳过该源，不覆盖旧 feed。
#
# 频率：每小时整点（cron "0 * * * *"）。无新增时 rebuild 打印 NO_NEW、不产生空提交。
# 说明：每小时一次，是因为事件的后续报道常在数小时内爆发；日更会在热点期明显滞后。

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-event-feed
  cancel-in-progress: false

# 说明：本仓库只走「GitHub Actions」这一种 Pages 发布方式（deploy 任务），
# 不依赖 Settings 里手工选 Deploy from a branch。
# 首次运行由 configure-pages 的 enablement 自动创建 Pages 站点；
# 若该步被拒（组织策略），到 Settings → Pages → Source 选「GitHub Actions」再运行一次即可。

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 第 1 步：按 src/events.json 的事件清单逐个抓增量。
      # Google News RSS 免密钥；某事件失败只影响自己，后续步骤照常。
      - name: Fetch new reports (best-effort)
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          events = json.load(open("src/events.json", encoding="utf-8"))["events"]
          for e in events:
              slug = e["slug"]
              out = os.path.join("data", slug, "incoming.jsonl")
              os.makedirs(os.path.dirname(out), exist_ok=True)
              cmd = [sys.executable, "src/fetch_articles.py",
                     "--slug", slug,
                     "--keywords", e["keywords"],
                     "--mode", "google_news",
                     "--workdir", "data",
                     "--since-days", str(e.get("since_days", 3)),
                     "--out", out]
              print("=== fetch", slug, "===")
              r = subprocess.run(cmd)
              print("exit:", r.returncode)
          PY

      # 第 2 步：合并 + 去重 + 时间对齐 + 重算时间轴（纯确定性，不调模型）
      # 无参数 = 遍历 data/ 下所有事件
      - name: Merge into timeline
        run: python src/rebuild.py

      # 第 3 步：从 data/event.json 渲染 RSS（配置驱动，见 src/sources.json）
      - name: Generate RSS
        run: python src/generate_feed.py

      # 第 4 步：XML 良构校验 + 提交（0 条时不提交，保留旧 feed）
      - name: Validate & commit
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for fn in sorted(glob.glob("*.xml")):
              root = ET.parse(fn).getroot()
              items = root.find("channel").findall("item")
              print(f"{fn}: {len(items)} items")
              assert items, f"{fn} 条目为 0，拒绝提交"
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add -A "*.xml" data
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: update event feed ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

  # ===================== 发布到 GitHub Pages =====================
  # 用 artifact 方式发布整个仓库根目录（index.html + duanju.xml + .nojekyll）。
  # checkout 是全新克隆，因此能拿到 update 任务刚 push 的最新 XML。
  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages (首次自动启用站点)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 只把对外可见的三个东西打包：首页、feed XML、.nojekyll。
      # 不能直接 path: "." —— 那样会把 .git、src、data 一并上传并公开。
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp *.xml _site/ 2>/dev/null || true
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
